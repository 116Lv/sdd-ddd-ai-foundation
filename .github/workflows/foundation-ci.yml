name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.20.0', '24.14.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check a new project
        run: |
          node tools/export-project.mjs --target-dir ci-starter --version 0.1.0 --project-name ci-starter
          node ci-starter/.foundation/checks/cli.mjs --project-root ci-starter
